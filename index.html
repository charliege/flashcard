<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Flip</title>
    <link rel="stylesheet" href="./style.css?v=9" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-top">
          <div>
            <h1>Study Flip</h1>
          </div>
          <button
            id="open-sync-panel"
            class="sync-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="sync-drawer"
          >
            Cloud Sync
          </button>
        </div>
      </header>

      <main class="layout">
        <section class="study-panel">
          <div class="topic-toolbar">
            <div class="topic-picker">
              <label class="topic-label" for="topic-select">Topic</label>
              <select id="topic-select" class="topic-select"></select>
            </div>
          </div>

          <div class="deck-status">
            <span id="card-count">0 cards</span>
            <span id="card-position">Card 0 of 0</span>
            <span id="sync-badge" class="sync-badge" data-mode="local"
              >Local only</span
            >
          </div>

          <div class="flashcard-shell">
            <button
              id="flashcard"
              class="flashcard"
              type="button"
              aria-label="Flip flash card"
            >
              <div class="card-face card-front">
                <div class="card-copy">
                  <p class="face-label">Front</p>
                  <div class="card-body">
                    <p id="card-front-text" class="card-text"></p>
                    <div id="card-front-media-frame" class="card-media-frame" hidden>
                      <img id="card-front-media" class="card-media" alt="" />
                    </div>
                  </div>
                </div>
              </div>
              <div class="card-face card-back">
                <div class="card-copy">
                  <p class="face-label">Back</p>
                  <div class="card-body">
                    <p id="card-back-text" class="card-text"></p>
                    <div id="card-back-media-frame" class="card-media-frame" hidden>
                      <img id="card-back-media" class="card-media" alt="" />
                    </div>
                  </div>
                </div>
              </div>
            </button>
            <button
              id="open-zoom"
              class="zoom-toggle"
              type="button"
              aria-haspopup="dialog"
              aria-controls="zoom-modal"
            >
              Zoom
            </button>
          </div>

          <div class="controls">
            <button id="prev-card" class="secondary-button" type="button">
              Previous
            </button>
            <button id="delete-card" class="ghost-button" type="button">
              Delete Current Card
            </button>
            <button id="edit-card" class="secondary-button" type="button">
              Edit Current Card
            </button>
            <button id="next-card" class="secondary-button" type="button">
              Next
            </button>
          </div>
        </section>

        <aside class="editor-panel">
          <section class="topic-manager">
            <p class="topic-note">
              Saving to <span id="active-topic-name">General</span>
            </p>

            <form id="topic-form" class="topic-form">
              <input
                id="topic-name"
                name="topic-name"
                type="text"
                placeholder="Create a new topic"
              />
              <button class="secondary-button" type="submit">New Topic</button>
            </form>
          </section>

          <h2 id="editor-title">Add a card</h2>

          <form id="card-form" class="card-form">
            <label for="question">Front</label>
            <textarea
              id="question"
              name="question"
              rows="4"
              placeholder="What do you want to remember?"
              required
            ></textarea>

            <label for="answer">Back</label>
            <textarea
              id="answer"
              name="answer"
              rows="4"
              placeholder="Write the answer or explanation."
              required
            ></textarea>

            <label for="card-image">Picture</label>
            <input
              id="card-image"
              name="card-image"
              class="file-input"
              type="file"
              accept="image/*"
            />

            <label for="image-side">Picture side</label>
            <select id="image-side" name="image-side">
              <option value="back" selected>Back</option>
              <option value="front">Front</option>
            </select>

            <div id="image-preview-shell" class="image-preview-shell" hidden>
              <img
                id="image-preview"
                class="image-preview"
                alt="Selected card image preview"
              />
              <button
                id="remove-image"
                class="ghost-button small-button"
                type="button"
              >
                Remove Image
              </button>
            </div>

            <div class="card-form-actions">
              <button id="save-card" class="primary-button" type="submit">
                Save Card
              </button>
              <button
                id="cancel-edit"
                class="ghost-button"
                type="button"
                hidden
              >
                Cancel Edit
              </button>
            </div>
          </form>

        </aside>
      </main>
    </div>

    <div id="sync-panel-backdrop" class="sync-panel-backdrop" hidden></div>
    <aside
      id="sync-drawer"
      class="sync-drawer"
      hidden
      aria-hidden="true"
      aria-labelledby="sync-drawer-title"
    >
      <section class="sync-panel">
        <div class="panel-header">
          <h2 id="sync-drawer-title">Cloud Sync</h2>
          <div class="drawer-actions">
            <button id="sign-out" class="ghost-button small-button" type="button">
              Sign Out
            </button>
            <button id="close-sync-panel" class="ghost-button small-button" type="button">
              Close
            </button>
          </div>
        </div>
        <p id="sync-message" class="panel-copy">
          Using this device only for now.
        </p>

        <form id="sync-form" class="card-form compact-form">
          <label for="sync-email">Sign in with email</label>
          <input
            id="sync-email"
            name="sync-email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
          <button class="primary-button" type="submit">Send Magic Link</button>
        </form>

        <details class="setup-details">
          <summary>Connect Supabase</summary>
          <form id="config-form" class="card-form compact-form">
            <label for="config-url">Project URL</label>
            <input
              id="config-url"
              name="config-url"
              type="url"
              placeholder="https://your-project.supabase.co"
            />

            <label for="config-key">Publishable or anon key</label>
            <textarea
              id="config-key"
              name="config-key"
              rows="3"
              placeholder="sb_publishable_... or your anon key"
            ></textarea>

            <button class="secondary-button" type="submit">
              Save Cloud Settings On This Device
            </button>
          </form>

          <p class="storage-note">
            For every device automatically, add the same values to
            <code>config.js</code> and push once to GitHub Pages.
          </p>
        </details>
      </section>
    </aside>

    <div id="zoom-backdrop" class="zoom-backdrop" hidden></div>
    <section
      id="zoom-modal"
      class="zoom-modal"
      hidden
      aria-hidden="true"
      aria-labelledby="zoom-title"
    >
      <div class="zoom-modal-panel">
        <div class="panel-header">
          <h2 id="zoom-title">Focus View</h2>
          <div class="drawer-actions">
            <button id="zoom-flip" class="secondary-button small-button" type="button">
              Flip
            </button>
            <button id="close-zoom" class="ghost-button small-button" type="button">
              Close
            </button>
          </div>
        </div>

        <button
          id="zoom-flashcard"
          class="flashcard flashcard-zoom"
          type="button"
          aria-label="Flip zoomed flash card"
        >
          <div class="card-face card-front">
            <div class="card-copy">
              <p class="face-label">Front</p>
              <div class="card-body">
                <p id="zoom-front-text" class="card-text zoom-card-text"></p>
                <div id="zoom-front-media-frame" class="card-media-frame" hidden>
                  <img id="zoom-front-media" class="card-media" alt="" />
                </div>
              </div>
            </div>
          </div>
          <div class="card-face card-back">
            <div class="card-copy">
              <p class="face-label">Back</p>
              <div class="card-body">
                <p id="zoom-back-text" class="card-text zoom-card-text"></p>
                <div id="zoom-back-media-frame" class="card-media-frame" hidden>
                  <img id="zoom-back-media" class="card-media" alt="" />
                </div>
              </div>
            </div>
          </div>
        </button>
      </div>
    </section>

    <script src="./config.js?v=2"></script>
    <script type="module" src="./script.js?v=9"></script>
  </body>
</html>
